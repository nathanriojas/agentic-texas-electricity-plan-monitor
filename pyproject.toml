[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "texas-electricity-plan-monitor"
version = "0.1.0"
description = "Sanitized reference implementation of an autonomous Texas electricity-plan decision engine"
requires-python = ">=3.11"
readme = "README.md"
license = {text = "MIT"}
dependencies = []

[project.optional-dependencies]
browser = ["playwright>=1.45"]

[project.scripts]
electricity-monitor = "electricity_monitor.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
